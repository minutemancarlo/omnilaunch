<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniLaunch Starting</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .splash-card {
      width: 460px;
      height: 300px;
      background: linear-gradient(145deg, rgba(14, 18, 24, 0.96), rgba(8, 11, 16, 0.98));
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 20px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(16, 185, 129, 0.2),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(20px);
    }

    /* Ambient background radial glow (Emerald & Cyan) */
    .ambient-glow {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, rgba(6, 182, 212, 0.12) 40%, transparent 70%);
      pointer-events: none;
      filter: blur(30px);
      animation: ambientPulse 3s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.9); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    /* Logo Container with Orbit Ring */
    .logo-container {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      animation: floatLogo 3s ease-in-out infinite alternate;
    }

    @keyframes floatLogo {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }

    .orbit-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px dashed rgba(16, 185, 129, 0.4);
      animation: rotateRing 12s linear infinite;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .orbit-spark {
      position: absolute;
      top: -3px;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981, 0 0 20px #06b6d4;
    }

    .logo-svg {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.5));
    }

    /* Title & Typography */
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ecfdf5 0%, #10b981 40%, #06b6d4 75%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .brand-subtitle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .version-pill {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.18);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    /* Loading Bar */
    .progress-bar-container {
      width: 240px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #10b981, #06b6d4, #3b82f6);
      border-radius: 99px;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
      animation: progressSlide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes progressSlide {
      0% {
        left: -45%;
      }
      100% {
        left: 100%;
      }
    }

    .status-text {
      font-size: 11px;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="ambient-glow"></div>

    <!-- Animated OmniLaunch Emblem -->
    <div class="logo-container">
      <div class="orbit-ring">
        <div class="orbit-spark"></div>
      </div>
      <svg class="logo-svg" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="splashPrimaryGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="45%" stop-color="#06b6d4"/>
            <stop offset="100%" stop-color="#3b82f6"/>
          </linearGradient>
          <linearGradient id="splashAccentGrad" x1="256" y1="384" x2="256" y2="96" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#06b6d4"/>
            <stop offset="60%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#a7f3d0"/>
          </linearGradient>
          <linearGradient id="splashSpeedArc" x1="128" y1="256" x2="384" y2="256" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#10b981"/>
          </linearGradient>
        </defs>

        <!-- Left Orbital Wing -->
        <path d="M128 356C96 296 104 208 152 148C200 88 276 68 344 96C320 116 264 128 220 164C176 200 156 264 152 320L128 356Z" 
              fill="url(#splashSpeedArc)" fill-opacity="0.75"/>
        
        <!-- Right Orbital Wing -->
        <path d="M384 356C416 296 408 208 360 148C312 88 236 68 168 96C192 116 248 128 292 164C336 200 356 264 360 320L384 356Z" 
              fill="url(#splashPrimaryGrad)" fill-opacity="0.9"/>

        <!-- Central Launch Shard / Supersonic Chevron -->
        <path d="M256 72L124 360L236 312L256 268V72Z" fill="url(#splashPrimaryGrad)"/>
        <path d="M256 72L388 360L276 312L256 268V72Z" fill="url(#splashAccentGrad)"/>

        <!-- Bottom Booster Exhaust -->
        <path d="M224 336L256 440L288 336L256 352L224 336Z" fill="url(#splashPrimaryGrad)"/>

        <!-- Central Quantum Core Spark -->
        <path d="M256 160L268 204L312 216L268 228L256 272L244 228L200 216L244 204L256 160Z" fill="#ffffff"/>
        <circle cx="256" cy="216" r="6" fill="#10b981"/>
      </svg>
    </div>

    <!-- Title & Version -->
    <div class="brand-title">OmniLaunch</div>
    <div class="brand-subtitle">
      <span>Workspace Orchestrator</span>
      <span>•</span>
      <span class="version-pill">v1.1.0</span>
    </div>

    <!-- Loading Bar -->
    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>

    <div class="status-text" id="status-label">Initializing workspace engine...</div>
  </div>

  <script>
    const messages = [
      'Initializing workspace engine...',
      'Hydrating local app icons & favicons...',
      'Loading quick shortcuts & routines...',
      'Ready to launch...',
    ];
    let idx = 0;
    const label = document.getElementById('status-label');
    setInterval(() => {
      idx = (idx + 1) % messages.length;
      if (label) label.textContent = messages[idx];
    }, 450);
  </script>
</body>
</html>
